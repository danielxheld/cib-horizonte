local_backend: true

backend:
  name: git-gateway

media_folder: "src/images"
public_folder: "/images"
locale: "de"

collections:
  # -------------------------------------------------------
  # 1. Allgemein – site.json
  # -------------------------------------------------------
  - name: "allgemein"
    label: "Allgemein"
    files:
      - name: "site"
        label: "Globale Einstellungen"
        file: "src/_data/site.json"
        fields:
          - { label: "Seitenname", name: "name", widget: "string" }
          - { label: "Inhaberin", name: "owner", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Beschreibung (SEO)", name: "description", widget: "text" }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }

  # -------------------------------------------------------
  # 2. Startseite – home.json
  # -------------------------------------------------------
  - name: "startseite"
    label: "Startseite"
    files:
      - name: "home"
        label: "Startseite"
        file: "src/_data/home.json"
        fields:
          - label: "Hero-Bereich"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Untertitel", name: "subtitle", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button-Text", name: "cta", widget: "string" }
          - label: "Willkommen"
            name: "welcome"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Leistungen"
            name: "services"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
          - label: "Alleinstellungsmerkmale"
            name: "usps"
            widget: "list"
            field:
              { label: "Merkmal", name: "usp", widget: "string" }
          - label: "Über-mich-Teaser"
            name: "about_teaser"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button-Text", name: "cta", widget: "string" }
          - label: "Call to Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Button-Text", name: "button", widget: "string" }

  # -------------------------------------------------------
  # 3. Leistungen – leistungen.json, zertifizierung.json,
  #    kommunen.json, gastronomie.json
  # -------------------------------------------------------
  - name: "leistungen"
    label: "Leistungen"
    files:
      - name: "leistungen_uebersicht"
        label: "Leistungsübersicht"
        file: "src/_data/leistungen.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Leistungen"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Kurzbeschreibung", name: "text", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }
          - { label: "Arbeitsweise", name: "arbeitsweise", widget: "string" }

      - name: "zertifizierung"
        label: "Zertifizierungsberatung"
        file: "src/_data/zertifizierung.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Leistungen"
            name: "services"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "text", widget: "text" }
          - { label: "Nutzenversprechen", name: "benefit", widget: "string" }

      - name: "kommunen"
        label: "Kommunen & Tourismus"
        file: "src/_data/kommunen.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Leistungen"
            name: "services"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "text", widget: "text" }
          - { label: "Nutzenversprechen", name: "benefit", widget: "string" }

      - name: "gastronomie"
        label: "Gastronomie & Hotellerie"
        file: "src/_data/gastronomie.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Leistungen"
            name: "services"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "text", widget: "text" }
          - { label: "Nutzenversprechen", name: "benefit", widget: "string" }

  # -------------------------------------------------------
  # 4. Coaching – coaching.json
  # -------------------------------------------------------
  - name: "coaching"
    label: "Coaching"
    files:
      - name: "coaching"
        label: "Coaching"
        file: "src/_data/coaching.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Zielgruppen"
            name: "target_group"
            widget: "list"
            field:
              { label: "Zielgruppe", name: "target", widget: "string" }
          - label: "Schwerpunkte"
            name: "schwerpunkte"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - label: "Themen"
                name: "items"
                widget: "list"
                field:
                  { label: "Thema", name: "item", widget: "string" }
          - { label: "Haltung", name: "haltung", widget: "text" }
          - label: "Ablauf"
            name: "ablauf"
            widget: "list"
            field:
              { label: "Schritt", name: "step", widget: "string" }

  # -------------------------------------------------------
  # 5. Über mich – uebermich.json
  # -------------------------------------------------------
  - name: "uebermich"
    label: "Über mich"
    files:
      - name: "uebermich"
        label: "Über mich"
        file: "src/_data/uebermich.json"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Rolle / Position", name: "role", widget: "string" }
          - { label: "Titel / Qualifikationen (Kurzform)", name: "titles", widget: "string" }
          - { label: "Haltung", name: "haltung", widget: "text" }
          - label: "Erfahrung"
            name: "erfahrung"
            widget: "list"
            fields:
              - { label: "Zeitraum", name: "period", widget: "string" }
              - { label: "Position", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "desc", widget: "string", required: false }
          - label: "Qualifikationen"
            name: "qualifikation"
            widget: "list"
            field:
              { label: "Qualifikation", name: "item", widget: "string" }
          - { label: "Anspruch", name: "anspruch", widget: "text" }

  # -------------------------------------------------------
  # 6. Referenzen – referenzen.json
  # -------------------------------------------------------
  - name: "referenzen"
    label: "Referenzen"
    files:
      - name: "referenzen"
        label: "Referenzen"
        file: "src/_data/referenzen.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Kategorien"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Kategorie", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "text", widget: "text" }
          - { label: "Hinweis", name: "note", widget: "text", required: false }

  # -------------------------------------------------------
  # 7. Kontakt – kontakt.json
  # -------------------------------------------------------
  - name: "kontakt"
    label: "Kontakt"
    files:
      - name: "kontakt"
        label: "Kontakt"
        file: "src/_data/kontakt.json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Anliegen-Optionen"
            name: "anliegen_optionen"
            widget: "list"
            field:
              { label: "Option", name: "option", widget: "string" }
